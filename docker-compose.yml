services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerlock
      POSTGRES_USER: ledgerlock
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlock -d ledgerlock"]
      interval: 5s
      timeout: 5s
      retries: 5
